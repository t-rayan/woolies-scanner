# This file was auto-generated by the Firebase CLI
# Updated for Flutter + Supabase Integration

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # THIS IS THE MISSING PIECE:
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Speeds up future builds

      - name: Install Dependencies
        run: flutter pub get

      # Create dummy .env so asset bundler doesn't fail (real creds come from --dart-define)
      - name: Create dummy .env for asset bundler
        run: echo 'SUPABASE_URL=dummy' > .env

      - name: Build Flutter Web
        run: flutter build web --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLANOGRAM_SCANNER }}
          channelId: live
          projectId: planogram-scanner