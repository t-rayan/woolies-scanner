name: woolies_scanner
description: "Woolworths Planogram Scanner — web & mobile"
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  image_picker: ^1.1.2
  supabase_flutter: ^2.5.3
  http: ^1.2.1
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  image: ^4.0.17
  shared_preferences: ^2.5.5
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # .env must be in assets so flutter_dotenv can find it on Android.
  # CI creates a dummy .env before building (--dart-define overrides it).
  assets:
    - .env
